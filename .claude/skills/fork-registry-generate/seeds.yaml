  feat.mitm-credential-proxy:
    name: MITM credential proxy (host-side token substitution)
    summary: >
      Keeps real credentials out of agent containers. Containers see placeholder tokens; all
      container egress is forced through a host-side MITM TLS proxy (per-group CA, SNI parsing)
      which recognizes provider endpoints and swaps placeholders for real tokens at the wire
      (bearer-swap / token-exchange / refresh / device-code OAuth handlers, driven by per-provider
      discovery documents). Includes interactive OAuth flows delivered through chat,
      borrowed-credential notification, per-group credential env materialization, and a tap logger
      for auditing proxied traffic.
    invariants:
      - "Real tokens never enter the container: agents only see placeholders; substitution happens
        host-side in the proxy. Upstream putting provider tokens into container env/config directly
        defeats the security model."
      - "All container egress must traverse the proxy: CA trust + proxy env are injected via
        container bootstrap (Dockerfile/entrypoint/env-vars). Upstream changes to container
        networking, base image, or entrypoint can silently bypass interception."
      - Composes via the AgentGroupContribution additive-merge (buildMitmProxyContribution); the
        single contribution merge point in container-runner must survive.
      - egress-lockdown parent's default-deny must stay compatible with proxy allow-listing.
      - OAuth module is init-explicit (initOAuthModule after proxy.start()); no import side effects.
      - "KNOWN RECURRING CONFLICT: poll-loop.{ts,test.ts} right after generateId
        (writeContainerFeedback/reportClassifiedError vs PerTurnResultDedup) — resolution is always
        KEEP BOTH; rerere has it recorded."
    overlap_hints: >
      Upstream work that counts as OVERLAP-HIGH: any credential brokering / secret manager / "keep
      API keys out of the sandbox" mechanism; OAuth device-flow or token-refresh plumbing for
      provider auth; an egress proxy, allowlist, or CA-injection scheme for containers; per-provider
      auth adapters or discovery documents. Upstream renaming or restructuring
      container/agent-runner auth or provider files is OVERLAP-TOUCH.
    routing:
      keywords:
        - proxy
        - mitm
        - credential
        - oauth
        - token
        - secret
        - egress
        - sandbox-network
      always_check_on:
        - dockerfile-change
        - new-skill
    prompt_extra_context: >
      Security-sensitive feature — prefer needs_human=true when unsure. Pay special attention to
      upstream changes in container/ (image, entrypoint, env plumbing): the interception path
      depends on them even when no fork-owned file is touched. Discovery JSONs under
      oauth/discovery/ are data, not code — upstream adding provider integrations may duplicate
      individual discovery entries without threatening the engine.
    notes: Borrowed-cred scope bug fixed via circuit-breaker ee0c1874 (2026-07-01).
