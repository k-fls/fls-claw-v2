  module.agent-group-contributions:
    name: Agent-group contributions + spawn-failure classification
    summary: >
      The fork's extension seam for per-agent-group container customization: modules register
      callbacks (registerAgentGroupContribution) that are invoked synchronously at spawn time and
      additively merged into one AgentGroupContribution consumed by buildMounts in container-runner.
      Also reworks the wakeContainer failure contract: retryable failures return false (host-sweep
      retries quietly), non-retryable failures throw FatalSpawnError and mark the session
      spawn-poisoned so subsequent wakes are no-ops until the next user inbound clears the flag.
    invariants:
      - "wakeContainer contract: true = spawned; false = retryable (host-sweep silently retries,
        inbound row stays pending); throws FatalSpawnError = non-retryable, session poisoned, router
        reports via deliverDirect. Upstream refactors of the spawn path / host-sweep retry semantics
        are high merge risk."
      - Contribution callbacks run synchronously; any throw is wrapped in FatalSpawnError by the
        registry. There is exactly ONE additive merge point, immediately before buildMounts.
      - Poison flag is cleared by the next user inbound (router); callers without channel context
        (host-sweep, notifyAgent wake) must .catch() and log only.
      - This is the composition substrate for every module/feat above it — an upstream change that
        replaces or reshapes ContainerContributor / buildMounts breaks the whole fork stack.
    overlap_hints: >
      OVERLAP-HIGH if upstream adds any plugin/extension/hook system for container spawn (per-group
      mounts, env, or config contributed by modules), or its own spawn-failure classification /
      retry-suppression. OVERLAP-TOUCH for any change to container-runner's spawn path, buildMounts
      signature, host-sweep retry loop, or router error delivery.
    routing:
      keywords:
        - contribution
        - plugin
        - hook
        - mounts
        - spawn
        - wake
      always_check_on: []
    prompt_extra_context: >
      Highest blast radius entry in the registry: every dependent branch inherits this seam. If
      verdict is OVERLAP-HIGH, recommended_action must address migration for ALL dependents listed
      above, and needs_human is mandatory.
    notes: src/provider-surfaces.test.ts intentionally NOT owned here — originates in shared commit
      14810a50 (agent-surfaces seam) present on main_patched too.
