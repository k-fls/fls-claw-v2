# human/agent-authored fields (owner decision 2026-07-10: invariants and
# overlap hints live HERE, not on a registry branch). The
# fork-registry-generate skill merges these over mechanically derived
# fields. Extracted from the 27 entries of the dissolved
# maint/fork-registry branch (ca693b0e, features tree e91f4b4e33e9).
#
# Per feature id:
#   name / summary          human-readable identity (judgment)
#   invariants              upstream assumptions; tripwire => OVERLAP-TOUCH+
#   overlap_hints           what upstream work would duplicate this feature
#   routing                 keywords + always_check_on (semi-judgment)
#   prompt_extra_context    injected into the overlap-check subagent prompt
#   notes                   ownership corrections / enrichment status
