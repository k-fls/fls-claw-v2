id: feat.mitm-credential-proxy
name: MITM credential proxy (host-side token substitution)
kind: feat
status: shipped                    # merged into edition/fls-ai-bot; pushed to origin (k-fls)
branch: feat/mitm-credential-proxy
parents: [module/container-queue, module/credentials, module/egress-lockdown,
          module/host-rpc, module/interactions-helpers, module/agent-group-contributions]
dependents: [feat/onecli-broker, edition/fls-ai-bot]

summary: >
  Keeps real credentials out of agent containers. Containers see placeholder tokens;
  all container egress is forced through a host-side MITM TLS proxy (per-group CA,
  SNI parsing) which recognizes provider endpoints and swaps placeholders for real
  tokens at the wire (bearer-swap / token-exchange / refresh / device-code OAuth
  handlers, driven by per-provider discovery documents). Includes interactive OAuth
  flows delivered through chat, borrowed-credential notification, per-group credential
  env materialization, and a tap logger for auditing proxied traffic.

owned_paths:
  - src/modules/mitm-proxy/**                    # core proxy, oauth/, handlers/, discovery/*.json
  - src/credential-acquisition.ts
  - src/credential-acquisition.test.ts
  - src/auth-container.ts
  - src/auth-container.test.ts
  - container/agent-runner/src/auth/**           # parse.ts, rpc-client.ts (+tests)
  - container/agent-runner/src/mcp-tools/credentials.ts
  - container/agent-runner/src/mcp-tools/auth-providers.ts
  - container/skills/credentials/SKILL.md
  - container/skills/auth-providers/SKILL.md
  - docs/mitm-proxy.md
  - docs/per-group-oauth-providers.md

touch_paths:
  - container/agent-runner/src/poll-loop.ts      # recurring conflict site (see invariants)
  - container/agent-runner/src/poll-loop.test.ts
  - container/agent-runner/src/providers/claude.ts
  - container/agent-runner/src/index.ts
  - container/agent-runner/src/env-vars.ts
  - container/Dockerfile
  - container/entrypoint.sh
  - container/shims/xdg-open
  - src/container-runner.ts
  - src/container-runtime.ts
  - src/index.ts
  - src/router.ts
  - src/session-manager.ts
  - src/shutdown.ts
  - src/config.ts
  - src/db/session-db.ts
  - package.json

key_symbols:
  - "CredentialProxy / setProxyInstance / getProxy — src/modules/mitm-proxy/credential-proxy.ts"
  - "proxyPipe / proxyBuffered / setProxyResponseHook — src/modules/mitm-proxy/credential-proxy.ts"
  - "createMitmContext / getMitmCaCertPath / parseSni — src/modules/mitm-proxy/mitm-ca.ts"
  - "TokenSubstituteEngine / initTokenEngine — src/modules/mitm-proxy/token-substitute.ts"
  - "defaultSubstitutes — src/modules/mitm-proxy/defaults.ts"
  - "initOAuthModule / oauthSubstitutesFor — src/modules/mitm-proxy/oauth/index.ts"
  - "oauthInteractive / dockerExecDeliver — src/modules/mitm-proxy/oauth/oauth-interactive.ts"
  - "borrowedCredentialNotifier — src/modules/mitm-proxy/oauth/borrowed-cred-notify.ts"
  - "buildMitmProxyContribution — src/modules/mitm-proxy/observer.ts"
  - "materializeGroupCredentialEnv — src/modules/mitm-proxy/credential-env.ts"
  - "planImport — src/modules/mitm-proxy/import-planning.ts"
  - "validateEnvVarFormat / isReservedEnvName — src/modules/mitm-proxy/env-name-validation.ts"

symbol_watch:
  - "credential|secret[_ -]?(store|manager|broker)"
  - "oauth|device[_ -]?code|token[_ -]?(exchange|refresh|swap)"
  - "https?_proxy|mitm|ca[_ -]?cert|self[_ -]?signed"
  - "bearer"

invariants:
  - "Real tokens never enter the container: agents only see placeholders; substitution
     happens host-side in the proxy. Upstream putting provider tokens into container
     env/config directly defeats the security model."
  - "All container egress must traverse the proxy: CA trust + proxy env are injected via
     container bootstrap (Dockerfile/entrypoint/env-vars). Upstream changes to container
     networking, base image, or entrypoint can silently bypass interception."
  - "Composes via the AgentGroupContribution additive-merge (buildMitmProxyContribution);
     the single contribution merge point in container-runner must survive."
  - "egress-lockdown parent's default-deny must stay compatible with proxy allow-listing."
  - "OAuth module is init-explicit (initOAuthModule after proxy.start()); no import side effects."
  - "KNOWN RECURRING CONFLICT: poll-loop.{ts,test.ts} right after generateId
     (writeContainerFeedback/reportClassifiedError vs PerTurnResultDedup) — resolution is
     always KEEP BOTH; rerere has it recorded."

design_docs:
  - docs/mitm-proxy.md@feat/mitm-credential-proxy
  - docs/per-group-oauth-providers.md@feat/mitm-credential-proxy
  - docs/egress-lockdown.md@feat/mitm-credential-proxy
  - docs/credentials.md@module/credentials

test_anchors:
  - src/modules/mitm-proxy/credential-proxy.test.ts
  - src/modules/mitm-proxy/token-substitute.test.ts
  - src/modules/mitm-proxy/oauth/handlers/bearer-swap.test.ts
  - src/modules/mitm-proxy/transparent-proxy.test.ts
  - src/modules/mitm-proxy/e2e.test.ts
  - src/modules/mitm-proxy/e2e-probe.test.ts

overlap_hints: >
  Upstream work that counts as OVERLAP-HIGH: any credential brokering / secret manager /
  "keep API keys out of the sandbox" mechanism; OAuth device-flow or token-refresh
  plumbing for provider auth; an egress proxy, allowlist, or CA-injection scheme for
  containers; per-provider auth adapters or discovery documents. Upstream renaming or
  restructuring container/agent-runner auth or provider files is OVERLAP-TOUCH.

routing:
  keywords: [proxy, mitm, credential, oauth, token, secret, egress, sandbox-network]
  always_check_on: [dockerfile-change, new-skill]

prompt:
  template: prompts/overlap-check.md
  extra_context: >
    Security-sensitive feature — prefer needs_human=true when unsure. Pay special
    attention to upstream changes in container/ (image, entrypoint, env plumbing):
    the interception path depends on them even when no fork-owned file is touched.
    Discovery JSONs under oauth/discovery/ are data, not code — upstream adding
    provider integrations may duplicate individual discovery entries without
    threatening the engine.

maintenance:
