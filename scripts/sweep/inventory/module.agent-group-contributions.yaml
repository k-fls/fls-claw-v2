id: module.agent-group-contributions
name: Agent-group contributions + spawn-failure classification
kind: module
branch: module/agent-group-contributions
parents:
  - main_patched
dependents:
  - module/container-bootstrap
  - module/host-rpc
  - module/interactions-helpers
  - feat/mitm-credential-proxy
  - feat/ssh-auth
  - feat/onecli-broker
  - edition/fls-ai-bot
summary: >
  The fork's extension seam for per-agent-group container customization: modules register callbacks
  (registerAgentGroupContribution) that are invoked synchronously at spawn time and additively
  merged into one AgentGroupContribution consumed by buildMounts in container-runner. Also reworks
  the wakeContainer failure contract: retryable failures return false (host-sweep retries quietly),
  non-retryable failures throw FatalSpawnError and mark the session spawn-poisoned so subsequent
  wakes are no-ops until the next user inbound clears the flag.
owned_paths:
  - src/agent-group-contributions.ts
  - src/agent-group-contributions.test.ts
  - src/spawn-failure.ts
  - src/spawn-failure.test.ts
  - docs/agent-group-contributions.md
  - docs/spawn-failure.md
key_symbols:
  - registerAgentGroupContribution / invokeAgentGroupContributions / clearAgentGroupContributions —
    src/agent-group-contributions.ts
  - AgentGroupContribution / AgentGroupContributionContext / AgentGroupContributionFn —
    src/agent-group-contributions.ts
  - FatalSpawnError / markSpawnPoisoned / isSpawnPoisoned — src/spawn-failure.ts
design_docs:
  - docs/agent-group-contributions.md@module/agent-group-contributions
  - docs/spawn-failure.md@module/agent-group-contributions
test_anchors:
  - src/agent-group-contributions.test.ts
  - src/spawn-failure.test.ts
  - src/container-runner.test.ts
routing:
  keywords:
    - contribution
    - plugin
    - hook
    - mounts
    - spawn
    - wake
  always_check_on: []
