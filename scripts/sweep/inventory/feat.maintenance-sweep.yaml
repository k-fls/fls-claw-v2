id: feat.maintenance-sweep
name: Upstream-sweep tooling (design 02 §5 mechanics, M0 operator CLI)
kind: feat
status: in-progress
branch: feat/maintenance-sweep
parents:
- main_patched
dependents: []
summary: 'The scripted core of the self-maintenance pipeline: sweep.ts CLI (scan, stop-points,
  DAG-ordered merge with rerere, everything-rebuild verify, state journaling, registry
  validation/routing, test-case replay). Consumes this registry branch via git show; dry-run
  by default, mutations gated behind --execute.'
owned_paths:
- scripts/sweep/**
touch_paths:
- package.json
- pnpm-lock.yaml
key_symbols:
- "sweep.ts subcommands: fetch|ff-main|scan|stop-points|merge|verify|record|status|validate-registry|route|replay — scripts/sweep/sweep.ts"
symbol_watch:
- "upstream[_ -]?(sync|sweep|merge)|fork[_ -]?maint"
- "merge-tree|rerere"
invariants:
- "New-style git merge-tree only (never --merge-base single-base preview); merge unit is the
  upstream first-parent commit; everything branch is verification-only."
- "sweep-state.json and fork-registry/** live on maint/fork-registry and are mutated only via
  script subcommands (journaled)."
design_docs:
- docs/design/02-self-maintaining-flsclaw.md@design/flsclaw
test_anchors:
- scripts/sweep/sweep.test.ts
- scripts/sweep/scan.test.ts
- scripts/sweep/merge.test.ts
- scripts/sweep/replay.test.ts
