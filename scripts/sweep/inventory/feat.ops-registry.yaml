id: feat.ops-registry
name: Ops registry (tenant/group YAML registry, design 08 WS-B)
kind: feat
status: in-progress              # implemented + reviewed on branch; NOT merged to main_patched;
                                 # F3 fail-closed fix resolved 2026-07-03
branch: feat/ops-registry
parents: [main_patched]
dependents: [feat/autonomy-matrix, feat/tenant-budgets, feat/calendar-triggers]  # stacked on it

summary: >
  Version-controlled YAML registry (default estate/registry.yaml, overridable via
  OPS_REGISTRY_PATH) mapping tenants -> subscription, agent groups, Todoist projects, chat
  surface, calendars, budget, quiet hours, and per-action autonomy levels. Exposes a frozen
  OpsRegistry consumer contract (design 08 §3.2) plus read-only `ncl registry list|get|reload`
  CLI. Loader is mtime-cached and fail-closed: absent or invalid file yields a no-op registry
  where autonomyFor() always returns 'gated' — never throws, never auto-approves — with the
  invalid state distinguished in getOpsRegistryStatus() and logged once per distinct error.

owned_paths:
  - src/modules/ops-registry/**        # index, loader, types, errors, fixtures/
  - src/cli/resources/registry.ts
  - src/cli/resources/registry.test.ts

touch_paths:
  - src/config.ts                      # OPS_REGISTRY_PATH constant + env allowlist entry
  - src/cli/resources/index.ts         # resource registration
  - src/command-gate.ts                # small content-parse change
  - src/channels/chat-sdk-bridge.ts
  - package.json                       # adds yaml@2.9.0
  - pnpm-lock.yaml

key_symbols:
  - "getOpsRegistry / getOpsRegistryStatus / reloadOpsRegistry / resetOpsRegistryCache — src/modules/ops-registry/index.ts"
  - "listTenantSummaries / getTenantEntry — src/modules/ops-registry/index.ts"
  - "LoadedRegistry — src/modules/ops-registry/index.ts"
  - "loadRegistry — src/modules/ops-registry/loader.ts"
  - "RegistryValidationError — src/modules/ops-registry/errors.ts"
  - "OpsRegistry / ActionType / AutonomyLevel / AutonomyMap / RegistryData / TenantSummary / ACTION_TYPES — src/modules/ops-registry/types.ts"
  - "OPS_REGISTRY_PATH — src/config.ts"

symbol_watch:
  - "tenant|multi[_ -]?tenan"
  - "autonomy|auto[_ -]?approv|approval[_ -]?polic"
  - "quiet[_ -]?hours|budget"
  - "registry\\.(ya?ml)"

invariants:
  - "FAIL CLOSED: invalid or absent registry file must never throw to callers and never
     auto-approve — autonomyFor() falls back to 'gated'. (Review decision F3, resolved
     2026-07-03.)"
  - "The OpsRegistry interface is FROZEN (design 08 §3.2): workstreams C, E, F, G, J are
     compiled against it; changes require re-freezing in 08-implementation-plan.md."
  - "The registry is a version-controlled YAML file, not a DB table; edits go through
     PR/approval-card flows. Upstream adding DB-backed org config would fork the model."
  - "Autonomy precedence: group > tenant > defaults > 'gated' (F7: tenant-level autonomy
     block is a sanctioned §4.1 extension)."

design_docs:
  - docs/design/08-implementation-plan.md@design/flsclaw    # §3.2 contract, §4.1 YAML schema
  - docs/design/08-personal-ops-setup.md@design/flsclaw
  - docs/design/02-self-maintaining-flsclaw.md@design/flsclaw

test_anchors:
  - src/modules/ops-registry/loader.test.ts
  - src/modules/ops-registry/registry.test.ts
  - src/cli/resources/registry.test.ts
  - src/modules/ops-registry/fixtures/registry.fixture.yaml   # shared fixture for consumers

overlap_hints: >
  OVERLAP-HIGH if upstream introduces tenant/org/workspace configuration, autonomy or
  approval-policy configuration, budgets, quiet hours, or a YAML-file-backed settings
  registry with a CLI. OVERLAP-TOUCH for changes to src/config.ts env handling, the
  `ncl` CLI resource framework (src/cli/resources/*), or a yaml dependency bump.

routing:
  keywords: [registry, tenant, autonomy, budget, quiet-hours, yaml]
  always_check_on: [dep-change]

prompt:
  template: prompts/overlap-check.md
  extra_context: >
    Status is in-progress: the branch is unmerged, so upstream conflicts will not surface
    as merge conflicts yet — evaluate overlap against the BRANCH content, not main_patched.
    Three sibling branches (autonomy-matrix, tenant-budgets, calendar-triggers) consume the
    frozen contract; treat contract-threatening upstream changes as OVERLAP-HIGH.

maintenance:
  owner: sweep-agent-group
  last_verified: "2026-07-10"
  verified_against: 7b9dca7d36d236ed4948144fa8bf1955c1a51681
  notes: "Migrations renumbered per F2: 022=autonomy-overrides, 023=usage-events (shipped)."
