id: feat.ops-registry
name: Ops registry (tenant/group YAML registry, design 08 WS-B)
kind: feat
branch: feat/ops-registry
parents:
  - main_patched
dependents:
  - feat/autonomy-matrix
  - feat/tenant-budgets
  - feat/calendar-triggers
summary: >
  Version-controlled YAML registry (default estate/registry.yaml, overridable via OPS_REGISTRY_PATH)
  mapping tenants -> subscription, agent groups, Todoist projects, chat surface, calendars, budget,
  quiet hours, and per-action autonomy levels. Exposes a frozen OpsRegistry consumer contract
  (design 08 §3.2) plus read-only `ncl registry list|get|reload` CLI. Loader is mtime-cached and
  fail-closed: absent or invalid file yields a no-op registry where autonomyFor() always returns
  'gated' — never throws, never auto-approves — with the invalid state distinguished in
  getOpsRegistryStatus() and logged once per distinct error.
owned_paths:
  - src/modules/ops-registry/**
  - src/cli/resources/registry.ts
  - src/cli/resources/registry.test.ts
key_symbols:
  - getOpsRegistry / getOpsRegistryStatus / reloadOpsRegistry / resetOpsRegistryCache —
    src/modules/ops-registry/index.ts
  - listTenantSummaries / getTenantEntry — src/modules/ops-registry/index.ts
  - LoadedRegistry — src/modules/ops-registry/index.ts
  - loadRegistry — src/modules/ops-registry/loader.ts
  - RegistryValidationError — src/modules/ops-registry/errors.ts
  - OpsRegistry / ActionType / AutonomyLevel / AutonomyMap / RegistryData / TenantSummary /
    ACTION_TYPES — src/modules/ops-registry/types.ts
  - OPS_REGISTRY_PATH — src/config.ts
design_docs:
  - docs/design/08-implementation-plan.md@design/flsclaw
  - docs/design/08-personal-ops-setup.md@design/flsclaw
  - docs/design/02-self-maintaining-flsclaw.md@design/flsclaw
test_anchors:
  - src/modules/ops-registry/loader.test.ts
  - src/modules/ops-registry/registry.test.ts
  - src/cli/resources/registry.test.ts
  - src/modules/ops-registry/fixtures/registry.fixture.yaml
routing:
  keywords:
    - registry
    - tenant
    - autonomy
    - budget
    - quiet-hours
    - yaml
  always_check_on:
    - dep-change
