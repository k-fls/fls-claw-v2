# Sweep scope configuration — POLICY, not state (exclusions are config;
# frozen/open-PoI state lives in the group-owned ledger).
#
# Scope rule (owner directive 2026-07-14): the sweep covers
#   - main_patched (structural: the only upstream entry point besides main's ff),
#   - every branch owned by a sweepable inventory entry (merge source = its
#     DAG parents, parents-before-children; NEVER upstream/main directly),
#   - non-inventory branches whose tip is an ancestor of any edition/* branch
#     ("present in an edition composition"; merge source = main ONLY — they
#     are upstream-PR candidates and must never absorb main_patched/fork
#     content). These are flagged until they get an inventory entry.
# Every other non-inventory branch is IGNORED (one digest drift line at most).
# There is no include-glob mechanism; `exclude` and the built-in namespace
# exclusions (everything*, experimental/*, wip/*, design/*, maint/*,
# worktree-agent-*, integration/*, test/*, sweep/*, fix/sweep/*) apply first.

exclude:
  # 750 commits behind main (merge-base 2026-04-28); structural conflicts.
  # Needs a dedicated rebase of its ~59 unique commits, not a sweep merge.
  - fix/channels/telegram-markdown-nesting

# extra_edges: child -> parents DAG edges not expressible in the inventory.
extra_edges: {}

# recipe: ordered branch list for the everything rebuild (verify stage).
# Mirrors the everything-branch rebuild order confirmed 2026-06-28.
recipe:
  - module/runtime-updater
  - feat/mitm-credential-proxy
  - feat/ssh-auth
  - feat/onecli-broker
  - module/container-bootstrap
  - docs/notes
