# Global driver levers, read by loadRoutingConfig (scripts/sweep/registry.ts).
# Tuning lives here so lever changes never touch code.
# Only levers with a live reader belong in this file.

schemaVersion: 1

# Case stacking (MERGE-POLICY.md §2): a case is the maximal run of consecutive
# path-intersecting conflicting heights, capped here. Per-feature override:
# `stack_cap:` on the inventory entry (mirrors the scope-guard lever).
stack_cap: 5

# Global scope-guard mode (PROPAGATION.md §7 lever): `same-files` (the default
# when this key is absent) or `conflict-hunks` (strict). Per-feature override:
# `scope_guard:` on the inventory entry.
# scope_guard_mode: same-files
