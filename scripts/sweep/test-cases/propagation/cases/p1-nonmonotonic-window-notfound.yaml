notes: >-
  The linear-sweep design (D-037) is still required by spec even though this
  repo's current range happens to be monotone: the synthetic fixture for the
  window case (section 11) remains the only executable window test until a
  real one appears. Recommendation: re-run the transition scan
  (FINDINGS.md, class 1) whenever upstream lands a revert; that is the
  cheapest trigger for re-mining this class.
