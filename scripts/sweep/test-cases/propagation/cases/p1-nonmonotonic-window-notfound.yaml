id: p1-nonmonotonic-window-notfound
class: 1 (non-monotonic conflict window, DRIVER.md section 4.3)
status: not-found-closest-shape
title: >-
  No branch in this repo has a conflict-at-k / clean-at-k+m window over the
  current pending chain; closest real shape pinned (branch-tip advancement
  clears the height-1 conflict, not upstream advancement)
watermark: 082f5c7ea99342fcb324ab78baacb0c4e6894029
chain:
  base: cb6e3d117c127054ca5bc5a53645d794d93cc595
  tip: 082f5c7ea99342fcb324ab78baacb0c4e6894029
  length: 98
  enumerate_cmd: git rev-list --first-parent --reverse main..upstream/main
not_found_evidence: >-
  44 branch tips were profiled with one merge-tree probe per height over all
  98 heights (4312 probes total): 42 live branches (every module/*, feat/*,
  fix/*, fix/main/*, edition/*, docs/notes, main_patched) plus two
  historical tips (main_patched@ad619134b9b0b783996265d0b121a616bab4ccdc,
  fix/ncl-crud-side-effects@adc402f4048a1e5888703a97988c7f469e28df25).
  Zero CONFLICT->CLEAN transitions were observed at any height in any
  profile, and zero path-level dropouts (no path ever leaves a branch's
  conflict set as the head advances) - conflict sets are strictly
  monotone-growing in this range. Consistent with that, the pending range
  contains no revert commits (git log --grep over main..upstream/main is
  empty), which removes the main mechanism that produces windows.
  Re-run: profiles/ contains the raw per-height results; the transition
  scan is a one-line awk over those files (see FINDINGS.md).
closest_shape:
  description: >-
    "Conflicted historically, clean today" exists in this repo only via
    branch-tip advancement: main_patched's OLD tip conflicts at height 1
    (#2890, src/cli/resources/groups.ts) while its CURRENT tip - which
    contains the recorded resolution merge - is clean at height 1 and first
    conflicts at height 92. Same branch, same chain, two tips. A sweep that
    cached "main_patched conflicts at h1" across passes without re-probing
    would be wrong today; this pins that staleness hazard even though
    per-tip monotonicity holds.
  old_tip:
    branch: main_patched (tip as of 2026-07-10)
    sha: ad619134b9b0b783996265d0b121a616bab4ccdc
    probe_height_1: CONFLICT [src/cli/resources/groups.ts]
    automerge_tree: f7c479b1249ede9437e9325f52602b1fc1e6a1f9
  current_tip:
    branch: main_patched
    sha: 453c746b2d49a07d836077b3fbb9172864c8b564
    coverage_height: 91
    probe_height_1: CLEAN
    first_conflict_height: 92
    conflicted_paths_at_92: [src/cli/resources/groups.ts]
    automerge_tree_at_92: 447e9a379bf6cd8c32df86bd2dfa290b85414c10
  resolution_ref: >-
    73d02022d77bf786dd3110de626004748e349f2e ("Merge upstream ef220b53bc83
    into main_patched (sweep)") - the merge that absorbed heights 1..91 and
    resolved the #2890 groups.ts conflict.
