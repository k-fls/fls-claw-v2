not_found_evidence: >-
  Grouping all 44 profiled tips by first-conflict height (FINDINGS.md
  table): every ancestor/descendant pair (inventory edges from
  maint/fork-registry:fork-registry/features/*.yaml, all git-verified)
  that shares a first-conflict height shares it at height 1, and every
  height-1 conflict set contains src/cli/resources/groups.ts - so all
  ancestor pairs INTERSECT (they are deferred-positive shapes, class 2).
  Pairs with disjoint sets (e.g. first-conflict at h3 {src/cli/dispatch.ts*}
  vs h62 {src/cli/resources/roles.ts} vs h77
  {container/agent-runner/src/poll-loop.ts} vs h92 vs h96) all have
  DIFFERENT first-conflict heights, so the N-prime == N precondition never
  fires disjointly across an ancestry edge today.
closest_shape:
