notes: >-
  The disjointness is structural: telegram-markdown-nesting predates the
  fork-era module stack (its merge base with the chain is ~750 commits
  behind main), so its collisions with #2890 land on packaging/setup files
  instead of the groups resource. Its conflict-set intersection with
  module/host-rpc's height-1 set is empty (verified above). Because no
  inventory edge connects them, a driver-level replay must synthesize the
  registry state (ancestor HELD at h1 with S_P={src/cli/resources/groups.ts})
  and then assert NOT-deferred for the telegram probe result.
